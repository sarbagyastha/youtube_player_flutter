name: youtube_player_workspace

workspace:
  - packages/youtube_player_flutter
  - packages/youtube_player_flutter/example
  - packages/youtube_player_iframe
  - packages/youtube_player_iframe/example
  - packages/youtube_player_iframe_web
  - packages/youtube_player_iframe_web/example
  - packages/youtube_player_platform_interface
  - packages/youtube_player_android
  - packages/youtube_player_darwin
  - packages/youtube_player_html
  - packages/youtube_player
  - packages/youtube_player/example

environment:
  sdk: ^3.11.0
  flutter: '>=3.38.0'

dev_dependencies:
  melos: ^8.10.1
  flutter_lints: ^6.0.0

melos:
  name: youtube_player_workspace
  repository: https://github.com/sarbagyastha/youtube_player_flutter
  categories:
    examples:
      - packages/youtube_player/example
      - packages/youtube_player_flutter/example
      - packages/youtube_player_iframe/example
    publishable:
      - packages/youtube_player_flutter
      - packages/youtube_player_iframe
      - packages/youtube_player_iframe_web
      - packages/youtube_player_platform_interface
      - packages/youtube_player_android
      - packages/youtube_player_darwin
      - packages/youtube_player_html
      - packages/youtube_player
  scripts:
    icon:
      exec: dart run icons_launcher:create
      description: Generate icons for all platforms
      packageFilters:
        dependsOn: icons_launcher
    analyze:
      exec: flutter analyze
      description: Run flutter analyze in every package
      packageFilters:
        flutter: true
    pana:
      exec: dart pub global run pana --exit-code-threshold 0 .
      description: Check publish readiness using pana for all publishable packages
      packageFilters:
        category: publishable