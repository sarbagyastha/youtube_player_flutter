name: Publish to pub.dev

# Triggered by tags like `yp_iframe-v6.0.4` (prefixes: yp_flutter, yp_iframe, yp_iframe_web).
# Requires automated publishing to be enabled on pub.dev for each package
# (Admin > Automated publishing > GitHub Actions, tag pattern `<prefix>-v{{version}}`).
# Publishing uses dart-lang's reusable workflow, which sets up the pub.dev OIDC credentials.
on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  resolve:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dir: ${{ steps.tag.outputs.dir }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve package from tag
        id: tag
        run: |
          prefix="${GITHUB_REF_NAME%-v*}"
          ver="${GITHUB_REF_NAME##*-v}"
          case "$prefix" in
            yp_flutter)    pkg=youtube_player_flutter ;;
            yp_iframe)     pkg=youtube_player_iframe ;;
            yp_iframe_web) pkg=youtube_player_iframe_web ;;
            *) echo "::error::Unknown tag prefix '$prefix' in $GITHUB_REF_NAME"; exit 1 ;;
          esac
          file="packages/$pkg/pubspec.yaml"
          actual="$(grep -m1 '^version:' "$file" | awk '{print $2}')"
          if [ "$actual" != "$ver" ]; then
            echo "::error::Tag version $ver does not match pubspec version $actual"; exit 1
          fi
          echo "dir=packages/$pkg" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: resolve
    permissions:
      id-token: write # Required for pub.dev OIDC authentication
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: ${{ needs.resolve.outputs.dir }}
