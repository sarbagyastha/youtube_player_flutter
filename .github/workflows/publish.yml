name: Publish to pub.dev

# Triggered by tags like `yp_iframe-v6.0.4` (prefixes: yp_flutter, yp_iframe, yp_iframe_web,
# yp, yp_pi, yp_android, yp_darwin, yp_html, yp_windows, yp_linux).
# Requires automated publishing to be enabled on pub.dev for each package
# (Admin > Automated publishing > GitHub Actions, tag pattern `<prefix>-v{{version}}`).
# Publishing uses dart-lang's reusable workflow, which sets up the pub.dev OIDC credentials.
on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  resolve:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dir: ${{ steps.tag.outputs.dir }}
      pkg: ${{ steps.tag.outputs.pkg }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve package from tag
        id: tag
        run: |
          prefix="${GITHUB_REF_NAME%-v*}"
          ver="${GITHUB_REF_NAME##*-v}"
          case "$prefix" in
            yp_flutter)    pkg=youtube_player_flutter ;;
            yp_iframe)     pkg=youtube_player_iframe ;;
            yp_iframe_web) pkg=youtube_player_iframe_web ;;
            yp)            pkg=youtube_player ;;
            yp_pi)         pkg=youtube_player_platform_interface ;;
            yp_android)    pkg=youtube_player_android ;;
            yp_darwin)     pkg=youtube_player_darwin ;;
            yp_html)       pkg=youtube_player_html ;;
            yp_windows)    pkg=youtube_player_windows ;;
            yp_linux)      pkg=youtube_player_linux ;;
            *) echo "::error::Unknown tag prefix '$prefix' in $GITHUB_REF_NAME"; exit 1 ;;
          esac
          file="packages/$pkg/pubspec.yaml"
          actual="$(grep -m1 '^version:' "$file" | awk '{print $2}')"
          if [ "$actual" != "$ver" ]; then
            echo "::error::Tag version $ver does not match pubspec version $actual"; exit 1
          fi
          echo "dir=packages/$pkg" >> "$GITHUB_OUTPUT"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: resolve
    permissions:
      id-token: write # Required for pub.dev OIDC authentication
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: ${{ needs.resolve.outputs.dir }}

  release:
    name: Create GitHub release
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the release
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        env:
          DIR: ${{ needs.resolve.outputs.dir }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## / { if (found) exit; found = ($2 == ver); next }
            found && /^\*\*.*\*\*$/ && !body { next }
            found && (body || NF) { body = 1; print }
          ' "$DIR/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::No CHANGELOG entry found for $VERSION in $DIR/CHANGELOG.md"; exit 1
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ needs.resolve.outputs.pkg }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$PKG $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$PKG $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
