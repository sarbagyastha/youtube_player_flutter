name: Pana

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'pubspec.yaml'
      - '.github/workflows/pana.yml'

jobs:
  pana:
    name: Check publish readiness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub global activate pana
      - run: dart run melos run pana
