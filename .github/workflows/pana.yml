name: Pana

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'pubspec.yaml'
      - '.github/workflows/pana.yml'

jobs:
  pana:
    name: Check publish readiness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub global activate pana
      - run: dart run melos run pana

  wasm:
    name: Wasm build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build youtube_player_iframe example (Wasm)
        working-directory: packages/youtube_player_iframe/example
        run: flutter build web --wasm --no-deprecated-js-interop
      - name: Build youtube_player_flutter example (Wasm)
        working-directory: packages/youtube_player_flutter/example
        run: flutter build web --wasm --no-deprecated-js-interop
