name: youtube_player_flutter
description: Flutter plugin for playing or streaming inline YouTube videos using the official iFrame player API. Powered by youtube_player.
version: 11.0.0
repository: https://github.com/sarbagyastha/youtube_player_flutter
homepage: https://github.com/sarbagyastha/youtube_player_flutter/tree/main/packages/youtube_player_flutter

topics:
  - youtube
  - video
  - player
  - iframe
  - multimedia

resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  youtube_player: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8
  youtube_player_platform_interface: ^0.1.2

flutter:
  uses-material-design: true

platforms:
  android:
  ios:
  macos:
  web:

screenshots:
  - description: Youtube Player iFrame Logo
    path: misc/ypf.webp