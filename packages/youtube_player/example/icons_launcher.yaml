# Regenerate with: dart run icons_launcher:create
# Sources are rendered from packages/youtube_player/doc/logo/logo.svg.
icons_launcher:
  image_path: assets/icon/rounded.png
  platforms:
    android:
      enable: true
      image_path: assets/icon/rounded.png
      adaptive_background_image: assets/icon/background.png
      adaptive_foreground_image: assets/icon/foreground.png
      adaptive_round_image: assets/icon/round.png
      adaptive_monochrome_image: assets/icon/monochrome.png
    ios:
      enable: true
      image_path: assets/icon/full.png
    macos:
      enable: true
      image_path: assets/icon/macos.png
    web:
      enable: true
      image_path: assets/icon/rounded.png
      maskable_image_path: assets/icon/full.png
      favicon_path: assets/icon/rounded.png
    windows:
      enable: true
      image_path: assets/icon/rounded.png
