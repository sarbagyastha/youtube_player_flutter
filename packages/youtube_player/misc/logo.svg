<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>youtube_player</title>
  <!-- Flat on purpose: solid fills only, so the rendered PNGs stay small. -->
  <defs>
    <mask id="tri" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <polygon points="186,126 186,314 349,220" fill="#fff" stroke="#fff" stroke-width="40" stroke-linejoin="round"/>
    </mask>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#E5102C"/>

    <!-- Faceted play mark (base fill hides anti-aliasing seams between facets) -->
    <g mask="url(#tri)">
      <rect x="140" y="60" width="280" height="320" fill="#D2D2DA"/>
      <polygon points="240,220 153,70 410,220" fill="#FFFFFF"/>
      <polygon points="240,220 153,370 153,70" fill="#ECECF0"/>
      <polygon points="240,220 410,220 153,370" fill="#D2D2DA"/>
    </g>

    <!-- Progress bar -->
    <rect x="120" y="386" width="272" height="12" rx="6" fill="#F7A3AE"/>
    <rect x="120" y="386" width="170" height="12" rx="6" fill="#FFFFFF"/>
    <circle cx="290" cy="392" r="17" fill="#FFFFFF"/>
    <circle cx="290" cy="392" r="7" fill="#E5102C"/>
  </g>
</svg>
